<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyltec AI Assistant</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 450px; height: 700px; background-color: #fff; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background-color: #4A90E2; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 20px; max-width: 85%; word-wrap: break-word; font-size: 14px; white-space: pre-wrap; line-height: 1.5; }
        .user-message { background-color: #0078FF; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background-color: #E4E6EB; color: black; align-self: flex-start; border-bottom-left-radius: 2px; }
        .loading { font-style: italic; color: #888; font-size: 12px; margin: 15px; display: none; }
        .input-area { padding: 15px; border-top: 1px solid #ddd; display: flex; gap: 10px; background: #fff; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { background-color: #4A90E2; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #357ABD; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 AI Assistant</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">สวัสดีครับ มีข้อมูลเกรดพลาสติกอะไรให้ช่วยหาไหมครับ?</div>
    </div>
    <div class="loading" id="loadingStatus">กำลังรอคำตอบจาก AI...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="พิมพ์ข้อความที่นี่..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">ส่ง</button>
    </div>
</div>

<script>
    const webhookUrl = "https://rev3.vinyltec.org/webhook-test/61c2d0fd-bedc-4bac-a825-920888f65f24"; 

    function handleEnter(event) {
        if (event.key === "Enter") sendMessage();
    }

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const messageText = inputField.value.trim();
        if (messageText === "") return;

        addMessage(messageText, "user-message");
        inputField.value = "";
        
        const loading = document.getElementById("loadingStatus");
        loading.style.display = "block";

        try {
            const response = await fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chatInput: messageText })
            });

            if (!response.ok) throw new Error("HTTP Error: " + response.status);

            const resData = await response.json();
            console.log("n8n Response:", resData);

            // แก้ไขปัญหาเครื่องหมาย [] ครอบข้อมูล
            // ดึงข้อมูลตัวแรกถ้ามาเป็น Array หรือใช้ข้อมูลตรงๆ ถ้ามาเป็น Object
            let cleanData = Array.isArray(resData) ? resData[0] : resData;

            // ดึงข้อความจาก key ชื่อ 'output'
            const botReply = cleanData.output || "ขออภัย ไม่ได้รับข้อความตอบกลับจากระบบ";

            addMessage(botReply, "bot-message");

        } catch (error) {
            console.error("Fetch Error:", error);
            addMessage("ไม่สามารถดึงข้อมูลได้ โปรดตรวจสอบ Console (F12)", "bot-message");
        } finally {
            loading.style.display = "none";
        }
    }

    function addMessage(text, className) {
        const messagesDiv = document.getElementById("chatMessages");
        const messageElement = document.createElement("div");
        messageElement.classList.add("message", className);
        messageElement.textContent = text;
        messagesDiv.appendChild(messageElement);
        messagesDiv.scrollTop = messagesDiv.scrollHeight; 
    }
</script>
</body>
</html>
