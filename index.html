<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vinyltec AI Assistant</title>
    <style>
        /* ตั้งค่าพื้นฐาน */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            overflow: hidden; /* ป้องกันจอเลื่อนไปมา */
        }

        /* ปรับ Container ให้เต็มจอเมื่อเปิดบนมือถือ และจำกัดขนาดเมื่อเปิดบนคอม */
        .chat-container { 
            width: 100%; 
            max-width: 500px; 
            height: 100%; /* เต็มความสูงหน้าจอ */
            background-color: #fff; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }

        .chat-header { 
            background-color: #4A90E2; 
            color: white; 
            padding: 15px; 
            text-align: center; 
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }

        .chat-messages { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            background-color: #f9f9f9;
        }

        /* ปรับปรุงบอลลูนข้อความ */
        .message { 
            padding: 12px 16px; 
            border-radius: 18px; 
            max-width: 88%; 
            word-wrap: break-word; 
            font-size: 15px; /* ขนาดกำลังดีสำหรับมือถือ */
            white-space: pre-wrap; /* เพื่อให้การเว้นบรรทัดจาก n8n แสดงผลถูกต้อง */
            line-height: 1.5; 
            position: relative;
        }

        .user-message { 
            background-color: #0078FF; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 4px; 
        }

        .bot-message { 
            background-color: #E4E6EB; 
            color: black; 
            align-self: flex-start; 
            border-bottom-left-radius: 4px; 
        }

        .loading { 
            font-style: italic; 
            color: #888; 
            font-size: 12px; 
            padding: 5px 15px; 
            display: none; 
        }

        /* ปรับปรุงส่วน Input ให้เหมาะกับนิ้วมือ */
        .input-area { 
            padding: 15px; 
            border-top: 1px solid #ddd; 
            display: flex; 
            gap: 10px; 
            background: #fff;
            /* รองรับพื้นที่แถบด้านล่างของ iPhone รุ่นใหม่ๆ */
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }

        input[type="text"] { 
            flex: 1; 
            padding: 12px 15px; 
            border: 1px solid #ddd; 
            border-radius: 25px; 
            outline: none; 
            font-size: 16px; /* ป้องกัน iOS ซูมจอเมื่อกดพิมพ์ */
            background: #f0f2f5;
        }

        button { 
            background-color: #4A90E2; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold;
            transition: 0.2s; 
        }

        button:active { background-color: #357ABD; transform: scale(0.95); }

        /* ปรับแต่ง Scrollbar ให้ดูสะอาดตา */
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 Vinyltec AI Assistant</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">สวัสดีครับ มีข้อมูลเกรดพลาสติกอะไรให้ช่วยหาไหมครับ?</div>
    </div>
    <div class="loading" id="loadingStatus">กำลังรอคำตอบจาก AI...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="พิมพ์ชื่อเกรด หรือคุณสมบัติ..." autocomplete="off">
        <button onclick="sendMessage()">ส่ง</button>
    </div>
</div>

<script>
    // ใช้ Webhook URL ของคุณ
    const webhookUrl = "https://rev3.vinyltec.org/webhook-test/61c2d0fd-bedc-4bac-a825-920888f65f24"; 

    // รองรับการกด Enter เพื่อส่งข้อความ
    document.getElementById("userInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") sendMessage();
    });

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const messageText = inputField.value.trim();
        if (messageText === "") return;

        addMessage(messageText, "user-message");
        inputField.value = "";
        
        const loading = document.getElementById("loadingStatus");
        loading.style.display = "block";

        try {
            const response = await fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chatInput: messageText })
            });

            if (!response.ok) throw new Error("HTTP Error: " + response.status);

            const resData = await response.json();
            
            // ใช้ Logic ที่คุณทำสำเร็จแล้วในการแกะ Array []
            let cleanData = Array.isArray(resData) ? resData[0] : resData;
            const botReply = cleanData.output || "ขออภัย ไม่ได้รับข้อความตอบกลับจากระบบ";

            addMessage(botReply, "bot-message");

        } catch (error) {
            console.error("Fetch Error:", error);
            addMessage("⚠️ เกิดข้อผิดพลาดในการเชื่อมต่อ โปรดลองอีกครั้ง", "bot-message");
        } finally {
            loading.style.display = "none";
        }
    }

    function addMessage(text, className) {
        const messagesDiv = document.getElementById("chatMessages");
        const messageElement = document.createElement("div");
        messageElement.classList.add("message", className);
        messageElement.textContent = text;
        messagesDiv.appendChild(messageElement);
        
        // Scroll ลงล่างสุดทุกครั้งที่มีข้อความใหม่
        messagesDiv.scrollTop = messagesDiv.scrollHeight; 
    }
</script>
</body>
</html>
